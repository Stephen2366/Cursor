<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>躲避陨石 - 迷你小游戏</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="title">躲避陨石</div>
          <div class="hint">方向键/WASD 移动 · 空格 冲刺 · R 重开</div>
        </div>
        <div class="hud" aria-live="polite">
          <div class="pill"><span class="label">分数</span><span id="score">0</span></div>
          <div class="pill">
            <span class="label">冲刺</span><span id="dash">就绪</span>
          </div>
          <div class="pill"><span class="label">最高</span><span id="best">0</span></div>
        </div>
      </header>

      <section class="stage">
        <canvas id="c" width="960" height="540" aria-label="游戏画布"></canvas>
        <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
          <div class="card">
            <div class="big" id="overlayTitle">游戏结束</div>
            <div class="sub" id="overlaySub">按 R 重新开始</div>
            <div class="actions">
              <button id="btnRestart" class="btn">重新开始 (R)</button>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer">
        <div class="tips">
          小技巧：冲刺可以穿过缝隙，但别在边缘乱冲。
        </div>
      </footer>
    </main>

    <script src="./game.js"></script>
  </body>
</html>
